services:
  - type: web
    name: cloud-nandy-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: SUPABASE_URL
        value: https://wyjkehxbybkakgxdnoje.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: property-images
      - key: SUPABASE_TABLE
        value: properties
      - key: ALLOWED_ORIGIN
        value: "*"
      - key: CCAVENUE_MERCHANT_ID
        value: "4450815"
      - key: CCAVENUE_ACCESS_CODE
        sync: false
      - key: CCAVENUE_WORKING_KEY
        sync: false
      - key: CCAVENUE_URL
        value: https://secure.ccavenue.com/transaction/transaction.do?command=initiateTransaction
      - key: BACKEND_URL
        value: https://cloudnandy-1cvn.onrender.com
      - key: FRONTEND_URL
        value: https://mnccoimbatore.in
      - key: CCAVENUE_REDIRECT_DOMAIN
        value: https://www.cloudynandyhills.com

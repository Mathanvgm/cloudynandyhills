<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Booking Confirmation | Cloud Nandy Hills</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--green:#16a34a;--green-lt:#dcfce7;--brand:#b45f3c;--dark:#17211d;--text:#1a1a1a;--muted:#6b7280;--border:#e5e7eb;--bg:#f0ede8}
    body{font-family:'Inter',sans-serif;background:var(--bg);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
    #confettiCanvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
    .wrap{width:100%;max-width:540px;position:relative;z-index:1}
    .hdr{background:var(--dark);border-radius:20px 20px 0 0;padding:20px 28px;display:flex;align-items:center;gap:12px}
    .hdr img{width:36px;height:36px;border-radius:50%;object-fit:cover}
    .hdr strong{display:block;color:#fff;font-size:1rem;font-weight:700}
    .hdr span{color:#9ca3af;font-size:0.78rem}
    .card{background:#fff;border-radius:0 0 20px 20px;box-shadow:0 24px 80px rgba(0,0,0,.14);overflow:hidden;animation:up .5s cubic-bezier(.16,1,.3,1) both}
    @keyframes up{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:translateY(0)}}
    .s-hero{background:linear-gradient(135deg,#052e16 0%,#14532d 60%,#166534 100%);padding:40px 28px 32px;text-align:center;position:relative;overflow:hidden}
    .s-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,rgba(34,197,94,.25) 0%,transparent 65%)}
    .ring{width:88px;height:88px;border-radius:50%;background:rgba(34,197,94,.15);border:2px solid rgba(34,197,94,.35);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;position:relative;z-index:1;animation:pop .6s .15s cubic-bezier(.16,1,.3,1) both}
    @keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
    .s-title{font-size:1.75rem;font-weight:900;color:#fff;letter-spacing:-.5px;margin-bottom:8px;position:relative;z-index:1}
    .s-sub{font-size:.9rem;color:#86efac;line-height:1.55;max-width:360px;margin:0 auto;position:relative;z-index:1}
    .sec{padding:24px 28px 0}
    .sec-lbl{font-size:.7rem;font-weight:700;letter-spacing:1.2px;color:var(--brand);text-transform:uppercase;margin-bottom:12px}
    .grid{border:1px solid var(--border);border-radius:12px;overflow:hidden}
    .row{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;font-size:.875rem;border-bottom:1px solid var(--border)}
    .row:last-child{border-bottom:none}
    .lbl{color:var(--muted);font-weight:500}
    .val{color:var(--text);font-weight:700;text-align:right}
    .val.g{color:var(--green)}
    .val.bdg{background:var(--green-lt);color:var(--green);padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:700}
    .guest{margin:16px 28px 0;background:linear-gradient(135deg,#faf8f6,#f5f0eb);border:1px solid #e8ddd4;border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px}
    .av{width:40px;height:40px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1rem;flex-shrink:0}
    .gi strong{display:block;color:var(--text);font-weight:700;font-size:.9rem;margin-bottom:2px}
    .gi span{color:var(--muted);font-size:.8rem}
    .enote{margin:14px 28px 0;padding:12px 16px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;display:flex;align-items:center;gap:10px;font-size:.82rem;color:#1d4ed8;line-height:1.4}
    .enote svg{flex-shrink:0}
    .cdwrap{margin:18px 28px 0;background:#f9fafb;border:1px solid var(--border);border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:10px}
    .cdtxt{font-size:.82rem;color:var(--muted);flex:1}
    .cdtxt strong{color:var(--text)}
    .btrack{height:4px;background:var(--border);border-radius:2px;overflow:hidden;flex:1;max-width:120px}
    .bfill{height:100%;background:var(--brand);border-radius:2px;width:100%;transition:width 1s linear}
    .acts{display:flex;gap:10px;padding:22px 28px 28px}
    .btn{flex:1;padding:14px 16px;border-radius:10px;border:none;font-size:.9rem;font-weight:700;cursor:pointer;text-decoration:none;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:transform .15s,box-shadow .15s}
    .btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.13)}
    .pdf{background:var(--dark);color:#fff}
    .home{background:var(--brand);color:#fff}
    .sec2{background:#f3f4f6;color:#374151}
    .f-hero{background:linear-gradient(135deg,#1f0a0a 0%,#450a0a 100%);padding:40px 28px 32px;text-align:center}
    .f-icon{width:88px;height:88px;border-radius:50%;background:rgba(239,68,68,.15);border:2px solid rgba(239,68,68,.3);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;animation:pop .5s .15s ease both}
    .f-title{font-size:1.6rem;font-weight:800;color:#fff;margin-bottom:8px}
    .f-sub{font-size:.9rem;color:#fca5a5;line-height:1.5}
    .ld{padding:60px 28px;text-align:center;color:#9ca3af}
    .sp{width:36px;height:36px;border:3px solid #e5e7eb;border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:480px){body{padding:12px}.hdr{padding:16px 18px;border-radius:14px 14px 0 0}.s-hero,.f-hero{padding:30px 18px 24px}.s-title{font-size:1.4rem}.sec{padding:18px 18px 0}.guest,.enote,.cdwrap{margin-left:18px;margin-right:18px}.acts{padding:18px 18px 22px;flex-direction:column}}
  </style>
</head>
<body>
<canvas id="confettiCanvas"></canvas>
<div class="wrap">
  <div class="hdr">
    <img src="./image.jpg" alt="Logo" onerror="this.style.display='none'" />
    <div><strong>Cloud Nandy Hills</strong><span>Poombarai, Kodaikanal &middot; Tamil Nadu</span></div>
  </div>
  <div class="card" id="prCard">
    <div class="ld"><div class="sp"></div>Processing your payment&hellip;</div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
  var card=document.getElementById('prCard');
  var p=new URLSearchParams(window.location.search);
  var status=(p.get('status')||'').toLowerCase();
  var orderId=p.get('order_id')||'';
  var amount=p.get('amount')||'';
  var tracking=p.get('tracking')||'';
  var saved;try{saved=JSON.parse(localStorage.getItem('cloudNandyLatestBooking')||'{}');}catch(e){saved={};}
  var isOk=status==='success'||status==='confirmed';
  var ref=orderId?orderId.toUpperCase():'\u2014';
  function fmt(v){return v?'\u20b9'+Number(v).toLocaleString('en-IN',{minimumFractionDigits:2}):'\u2014';}
  function fd(d){return d?d.split('-').reverse().join(' '):'\u2014';}

  if(isOk){build();confetti();countdown();}else{fail();}

  function build(){
    var ini=(saved.name||'G').charAt(0).toUpperCase();
    var rows=[{l:'Booking Status',v:'CONFIRMED',b:true},{l:'Booking Ref',v:ref}];
    if(saved.room)rows.push({l:'Room',v:saved.room});
    if(saved.check_in)rows.push({l:'Check-In',v:fd(saved.check_in)+' \u00b7 1:00 PM'});
    if(saved.check_out)rows.push({l:'Check-Out',v:fd(saved.check_out)+' \u00b7 11:00 AM'});
    if(saved.adults||saved.children){var g=(saved.adults||1)+' Adult'+((saved.adults||1)>1?'s':'');if(saved.children>0)g+=', '+saved.children+' Child';rows.push({l:'Guests',v:g});}
    if(amount)rows.push({l:'Amount Paid',v:fmt(amount),g:true});
    if(tracking)rows.push({l:'Tracking ID',v:tracking});
    var rh=rows.map(function(r){return'<div class="row"><span class="lbl">'+r.l+'</span><span class="val '+(r.b?'bdg':r.g?'g':'')+'">'+r.v+'</span></div>';}).join('');
    var gh=saved.name?'<div class="guest"><div class="av">'+ini+'</div><div class="gi"><strong>'+saved.name+'</strong><span>'+(saved.phone?'\ud83d\udcde '+saved.phone:'')+(saved.email?' &nbsp;\u00b7 \u2709 '+saved.email:'')+'</span></div></div>':'';
    var eh=saved.email?'<div class="enote"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>Confirmation sent to <strong style="margin-left:4px">'+saved.email+'</strong></div>':'';
    card.innerHTML='<div class="s-hero"><div class="ring"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div><div class="s-title">Booking Confirmed! &#127881;</div><p class="s-sub">Your stay at Cloud Nandy Hills is secured. We look forward to welcoming you!</p></div>'
      +gh+'<div class="sec"><div class="sec-lbl">Booking Summary</div><div class="grid">'+rh+'</div></div>'+eh
      +'<div class="cdwrap" id="cdw"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span class="cdtxt">Auto-returning home in <strong id="cdt">3:00</strong></span><div class="btrack"><div class="bfill" id="cdb"></div></div></div>'
      +'<div class="acts"><button id="bpdf" class="btn pdf"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Download PDF</button>'
      +'<a href="./index.html" class="btn home" id="bhome"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Go to Home</a></div>';
    localStorage.removeItem('cloudNandyLatestBooking');
    pdf();
  }

  function fail(){
    var c=status==='cancelled'||status==='aborted';
    card.innerHTML='<div class="f-hero"><div class="f-icon"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">'+(c?'<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>':'<path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>')+'</svg></div>'
      +'<div class="f-title">'+(c?'Payment Cancelled':'Payment Failed')+'</div><p class="f-sub">'+(c?'You cancelled the payment. Your booking was not confirmed.':'Your payment could not be processed. Please try again.')+'</p></div>'
      +'<div class="sec"><div class="grid">'+(orderId?'<div class="row"><span class="lbl">Booking Ref</span><span class="val">'+ref+'</span></div>':'')+'<div class="row"><span class="lbl">Status</span><span class="val" style="color:#ef4444">'+status.toUpperCase()+'</span></div></div></div>'
      +'<div class="enote" style="background:#fff7ed;border-color:#fed7aa;color:#9a3412;margin-top:14px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2A19.79 19.79 0 0113.19 19a19.5 19.5 0 01-6-6A19.79 19.79 0 013.1 6.18 2 2 0 015.07 4h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L9.09 11.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>Need help? Call: <strong style="margin-left:4px">090957 44759</strong></div>'
      +'<div class="acts"><a href="./booking.html" class="btn home">&#8617; Try Again</a><a href="./index.html" class="btn sec2">&#127968; Go to Home</a></div>';
  }

  function countdown(){
    var T=180,r=T,cdt=document.getElementById('cdt'),cdb=document.getElementById('cdb');
    if(!cdt)return;
    var tmr=setInterval(function(){r--;var m=Math.floor(r/60),s=r%60;cdt.textContent=m+':'+(s<10?'0':'')+s;cdb.style.width=(r/T*100)+'%';if(r<=0){clearInterval(tmr);location.href='./index.html';}},1000);
    var bh=document.getElementById('bhome');if(bh)bh.addEventListener('click',function(){clearInterval(tmr);});
  }

  function confetti(){
    var cv=document.getElementById('confettiCanvas');if(!cv)return;
    var ctx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
    var cols=['#16a34a','#22c55e','#4ade80','#b45f3c','#fbbf24','#dcfce7','#fff'];
    var ps=[];for(var i=0;i<110;i++)ps.push({x:Math.random()*cv.width,y:-20-Math.random()*80,w:6+Math.random()*8,h:10+Math.random()*6,r:Math.random()*Math.PI*2,dr:(Math.random()-.5)*.15,vx:(Math.random()-.5)*2,vy:2+Math.random()*4,c:cols[Math.floor(Math.random()*cols.length)],a:1});
    function draw(){ctx.clearRect(0,0,cv.width,cv.height);var alive=false;ps.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.r+=p.dr;if(p.y>cv.height)p.a-=.05;if(p.a>0)alive=true;ctx.save();ctx.globalAlpha=Math.max(p.a,0);ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});if(alive)requestAnimationFrame(draw);}
    draw();
  }

  function pdf(){
    var btn=document.getElementById('bpdf');if(!btn)return;
    btn.addEventListener('click',function(){
      if(!window.jspdf){alert('PDF library not loaded. Please refresh.');return;}
      var doc=new window.jspdf.jsPDF({unit:'pt',format:'a4'});
      var W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight(),m=48,cW=W-m*2,y=m;
      var safe=function(v){return String(v||'\u2014');};
      doc.setFillColor(23,33,29);doc.rect(0,0,W,70,'F');
      doc.setFillColor(180,95,60);doc.circle(m+20,35,18,'F');
      doc.setFont('helvetica','bold');doc.setFontSize(12);doc.setTextColor(255,255,255);doc.text('CNH',m+20,39,{align:'center'});
      doc.setFontSize(18);doc.text('Cloud Nandy Hills',m+46,32);
      doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(156,163,175);
      doc.text('Poombarai, Kodaikanal \u00b7 Tamil Nadu 624103',m+46,46);
      doc.text('cloudynandyhills.com  \u00b7  090957 44759',m+46,58);
      doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(156,163,175);doc.text('BOOKING REFERENCE',W-m,26,{align:'right'});
      doc.setFontSize(12);doc.setTextColor(255,255,255);doc.text(safe(ref),W-m,44,{align:'right'});
      if(tracking){doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(156,163,175);doc.text('TXN: '+tracking,W-m,58,{align:'right'});}
      y=90;
      doc.setFillColor(22,163,74);doc.roundedRect(m,y,110,24,6,6,'F');doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(255,255,255);doc.text('\u2713  CONFIRMED',m+55,y+15.5,{align:'center'});
      doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(107,114,128);doc.text('Generated: '+new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}),W-m,y+16,{align:'right'});
      y+=44;
      function st(t){doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(180,95,60);doc.text(t,m,y);y+=5;doc.setDrawColor(180,95,60);doc.setLineWidth(.4);doc.line(m,y,m+cW,y);y+=14;}
      function rw(l,v,sh){if(sh){doc.setFillColor(249,250,251);doc.rect(m,y-12,cW,22,'F');}doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(107,114,128);doc.text(l,m+6,y);doc.setFont('helvetica','bold');doc.setTextColor(30,41,59);doc.text(safe(v),m+cW*.46,y);y+=22;}
      st('GUEST INFORMATION');if(saved.name)rw('Full Name',saved.name,false);if(saved.phone)rw('Phone',saved.phone,true);if(saved.email)rw('Email',saved.email,false);y+=10;
      st('STAY DETAILS');if(saved.room)rw('Room / Cabin',saved.room,false);if(saved.check_in)rw('Check-In',fd(saved.check_in)+' at 1:00 PM',true);if(saved.check_out)rw('Check-Out',fd(saved.check_out)+' at 11:00 AM',false);if(saved.adults)rw('Adults',saved.adults,true);if(saved.children)rw('Children',saved.children,false);if(saved.requests)rw('Special Requests',saved.requests,true);y+=10;
      st('PAYMENT INFORMATION');rw('Payment Status','CONFIRMED',false);if(amount)rw('Amount Paid',fmt(amount),true);rw('Order ID',orderId||'\u2014',false);if(tracking)rw('Tracking ID',tracking,true);y+=16;
      doc.setFillColor(240,237,232);doc.roundedRect(m,y,cW,56,6,6,'F');doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(23,33,29);doc.text('Property Policies',m+10,y+14);doc.setFont('helvetica','normal');doc.setTextColor(107,114,128);doc.text('\u2022 Check-in: 1:00 PM  |  Check-out: 11:00 AM',m+10,y+28);doc.text('\u2022 Please carry a valid government-issued photo ID.',m+10,y+41);
      doc.setDrawColor(229,231,235);doc.setLineWidth(.5);doc.line(m,H-48,W-m,H-48);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(148,163,184);doc.text('Thank you for choosing Cloud Nandy Hills. For queries: 090957 44759',W/2,H-32,{align:'center'});doc.text('No.5/166, Kochakanal Street, Poombarai, Kodaikanal, Tamil Nadu 624103',W/2,H-18,{align:'center'});
      doc.save('CloudNandy_Booking_'+(orderId||'receipt').replace(/[^A-Z0-9\-]/gi,'')+'.pdf');
    });
  }
})();
</script>
</body>
</html>

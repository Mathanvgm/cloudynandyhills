<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booking Confirmation | Cloud Nandy Hills</title>
  <meta name="description" content="Cloud Nandy Hills booking confirmation and receipt. Check your reservation details, policies, and download official PDF voucher." />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-dark: #08110e;
      --bg-card: rgba(18, 29, 24, 0.94);
      --bg-surface: #14231c;
      --brand: #b45f3c;
      --brand-hover: #9a4f32;
      --brand-gold: #e5b869;
      --emerald-dark: #064e3b;
      --emerald: #10b981;
      --emerald-light: #d1fae5;
      --crimson-dark: #450a0a;
      --crimson: #ef4444;
      --crimson-light: #fee2e2;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-glow: rgba(180, 95, 60, 0.35);
      --font-heading: 'Outfit', sans-serif;
      --font-body: 'Inter', sans-serif;
      --font-serif: 'Playfair Display', serif;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(180, 95, 60, 0.09) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(16, 185, 129, 0.07) 0%, transparent 50%),
        linear-gradient(180deg, #0a1410 0%, #060b09 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 18px;
      position: relative;
      overflow-x: hidden;
    }

    #confettiCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .main-container {
      width: 100%;
      max-width: 620px;
      position: relative;
      z-index: 10;
      animation: cardAppear 0.65s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes cardAppear {
      0% { opacity: 0; transform: translateY(30px) scale(0.97); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Top Branding Header */
    .top-header {
      background: rgba(14, 23, 19, 0.88);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-bottom: none;
      border-radius: 20px 20px 0 0;
      padding: 20px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .brand-logo {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--brand-gold);
      box-shadow: 0 4px 12px rgba(180, 95, 60, 0.35);
    }

    .brand-text h1 {
      font-family: var(--font-heading);
      font-size: 1.15rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    .brand-text span {
      font-size: 0.76rem;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .hotel-phone-badge {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--brand-gold);
      background: rgba(229, 184, 105, 0.1);
      border: 1px solid rgba(229, 184, 105, 0.25);
      padding: 6px 14px;
      border-radius: 999px;
      text-decoration: none;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .hotel-phone-badge:hover {
      background: rgba(229, 184, 105, 0.2);
      transform: translateY(-1px);
    }

    /* Main Card Content */
    .booking-card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      border-radius: 0 0 20px 20px;
      overflow: hidden;
      box-shadow: 0 30px 100px -15px rgba(0, 0, 0, 0.65);
    }

    /* Hero Section: Success */
    .hero-success {
      background: linear-gradient(180deg, rgba(6, 78, 59, 0.45) 0%, rgba(6, 78, 59, 0.08) 100%);
      border-bottom: 1px solid rgba(16, 185, 129, 0.2);
      padding: 42px 28px 34px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* Hero Section: Failure */
    .hero-failure {
      background: linear-gradient(180deg, rgba(69, 10, 10, 0.5) 0%, rgba(69, 10, 10, 0.08) 100%);
      border-bottom: 1px solid rgba(239, 68, 68, 0.2);
      padding: 42px 28px 34px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* Animated Status Rings */
    .status-ring {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .status-ring.success-ring {
      background: radial-gradient(circle, rgba(16, 185, 129, 0.25) 0%, rgba(16, 185, 129, 0.05) 70%);
      border: 2px solid rgba(16, 185, 129, 0.4);
      box-shadow: 0 0 35px rgba(16, 185, 129, 0.35);
      animation: ringPulse 2s infinite ease-in-out;
    }

    .status-ring.failure-ring {
      background: radial-gradient(circle, rgba(239, 68, 68, 0.25) 0%, rgba(239, 68, 68, 0.05) 70%);
      border: 2px solid rgba(239, 68, 68, 0.4);
      box-shadow: 0 0 35px rgba(239, 68, 68, 0.35);
      animation: ringShake 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes ringPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 25px rgba(16, 185, 129, 0.3); }
      50% { transform: scale(1.05); box-shadow: 0 0 45px rgba(16, 185, 129, 0.55); }
    }

    @keyframes ringShake {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
      40%, 60% { transform: translate3d(4px, 0, 0); }
    }

    .hero-title {
      font-family: var(--font-heading);
      font-size: 1.85rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    .hero-subtitle {
      font-size: 0.95rem;
      line-height: 1.55;
      max-width: 440px;
      margin: 0 auto;
    }

    .hero-subtitle.success { color: #86efac; }
    .hero-subtitle.failure { color: #fca5a5; }

    /* Content Section */
    .card-body {
      padding: 28px;
    }

    /* Guest Pill Card */
    .guest-highlight-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 16px 20px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .guest-avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--brand), #8c4226);
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 10px rgba(180, 95, 60, 0.35);
    }

    .guest-info h3 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 3px;
    }

    .guest-info p {
      font-size: 0.82rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* Section Headers */
    .section-label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--brand-gold);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Details Grid Table */
    .details-table {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .table-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 18px;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 0.88rem;
    }

    .table-row:last-child {
      border-bottom: none;
    }

    .table-row .row-label {
      color: var(--text-muted);
      font-weight: 500;
    }

    .table-row .row-value {
      color: #ffffff;
      font-weight: 700;
      text-align: right;
    }

    .row-value.price {
      color: #34d399;
      font-size: 1.05rem;
    }

    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .badge-status.confirmed {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.35);
    }

    .badge-status.cancelled {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.35);
    }

    .copy-btn {
      background: none;
      border: none;
      color: var(--brand-gold);
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 700;
      margin-left: 8px;
      padding: 2px 6px;
      border-radius: 4px;
      transition: background 0.15s;
    }

    .copy-btn:hover {
      background: rgba(229, 184, 105, 0.15);
    }

    /* Policy & Notice Box */
    .notice-box {
      background: rgba(180, 95, 60, 0.08);
      border: 1px solid rgba(180, 95, 60, 0.25);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 24px;
      font-size: 0.85rem;
      line-height: 1.5;
      color: #fed7aa;
    }

    .notice-box.failure-notice {
      background: rgba(239, 68, 68, 0.08);
      border-color: rgba(239, 68, 68, 0.25);
      color: #fca5a5;
    }

    .notice-box strong {
      color: #ffffff;
    }

    /* Action Buttons */
    .actions-grid {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .action-btn {
      flex: 1;
      min-width: 170px;
      padding: 15px 20px;
      border-radius: 12px;
      font-family: var(--font-heading);
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      cursor: pointer;
      border: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .action-btn.btn-primary {
      background: linear-gradient(135deg, var(--brand) 0%, #9a4f32 100%);
      color: #ffffff;
      box-shadow: 0 4px 18px rgba(180, 95, 60, 0.35);
    }

    .action-btn.btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(180, 95, 60, 0.5);
    }

    .action-btn.btn-secondary {
      background: var(--bg-surface);
      color: #ffffff;
      border: 1px solid var(--border-subtle);
    }

    .action-btn.btn-secondary:hover {
      background: rgba(255, 255, 255, 0.06);
      transform: translateY(-2px);
    }

    .action-btn.btn-danger {
      background: linear-gradient(135deg, var(--crimson) 0%, #b91c1c 100%);
      color: #ffffff;
      box-shadow: 0 4px 18px rgba(239, 68, 68, 0.35);
    }

    .action-btn.btn-danger:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(239, 68, 68, 0.5);
    }

    /* Loading Spinner */
    .loader-wrap {
      padding: 70px 20px;
      text-align: center;
      color: var(--text-muted);
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Toast Notification */
    #toastMsg {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1e293b;
      color: #fff;
      padding: 12px 24px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      z-index: 1000;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #toastMsg.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 540px) {
      body { padding: 16px 10px; }
      .top-header { padding: 16px 18px; }
      .hero-success, .hero-failure { padding: 32px 18px 26px; }
      .hero-title { font-size: 1.55rem; }
      .card-body { padding: 20px 16px; }
      .actions-grid { flex-direction: column; }
      .action-btn { width: 100%; }
    }
  </style>
</head>
<body>
  <canvas id="confettiCanvas"></canvas>
  <div id="toastMsg">Booking ID copied to clipboard!</div>

  <main class="main-container">
    <!-- Header -->
    <header class="top-header">
      <a href="./index.html" class="brand-group" aria-label="Cloud Nandy Hills">
        <img src="./image.jpg" alt="Logo" class="brand-logo" onerror="this.style.display='none'" />
        <div class="brand-text">
          <h1>Cloud Nandy Hills</h1>
          <span>Poombarai &middot; Kodaikanal</span>
        </div>
      </a>
      <a href="tel:+919095744759" class="hotel-phone-badge">
        &#9742; 090957 44759
      </a>
    </header>

    <!-- Card Content Container -->
    <div class="booking-card" id="bookingCard">
      <div class="loader-wrap">
        <div class="spinner"></div>
        <p>Verifying booking &amp; payment status with Cloud Nandy Hills&hellip;</p>
      </div>
    </div>
  </main>

  <!-- Include jsPDF for Instant PDF Voucher Download -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js?v=20"></script>

  <script>
    (async function () {
      "use strict";

      const card = document.getElementById("bookingCard");
      const toast = document.getElementById("toastMsg");

      function showToast(msg) {
        if (!toast) return;
        toast.textContent = msg;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 3500);
      }

      // Parse Query Parameters
      const params = new URLSearchParams(window.location.search);
      const rawStatus = (params.get("status") || "").toLowerCase();
      const orderId = params.get("order_id") || "";
      const trackingId = params.get("tracking") || "";
      const amountParam = params.get("amount") || "";

      const isSuccess = rawStatus === "success" || rawStatus === "confirmed";

      // 1. Retrieve booking data from LocalStorage first (cached before payment redirect)
      let bookingData = {};
      try {
        const stored = localStorage.getItem("cloudNandyLatestBooking");
        if (stored) bookingData = JSON.parse(stored);
      } catch (e) {
        bookingData = {};
      }

      // 2. Fallback: If localStorage was cleared (e.g. reload or email link), fetch directly from Supabase
      if ((!bookingData.name || !bookingData.room) && orderId) {
        try {
          const cfg = window.CLOUD_NANDY_SUPABASE || window.SUPABASE_CONFIG || {};
          const url = cfg.url || "https://wyjkehxbybkakgxdnoje.supabase.co";
          const key = cfg.key || cfg.anonKey || "sb_publishable_FmN54Y2I0thkiRcGsoZWzg_VSfI6Dia";
          if (window.supabase) {
            const client = window.supabase.createClient(url, key);
            const { data } = await client
              .from("bookings")
              .select("*")
              .eq("order_id", orderId)
              .maybeSingle();

            if (data) {
              bookingData = {
                name: data.name,
                email: data.email,
                phone: data.phone,
                room: data.room,
                check_in: data.check_in,
                check_out: data.check_out,
                adults: data.adults,
                children: data.children,
                total_amount: data.total_amount,
                requests: data.requests,
                order_id: data.order_id,
                status: data.status,
              };
            }
          }
        } catch (dbErr) {
          console.warn("Could not query Supabase for booking details:", dbErr);
        }
      }

      // Formatters
      const formatCurrency = (val) => {
        const num = Number(val) || 0;
        return "₹" + num.toLocaleString("en-IN", { minimumFractionDigits: 2 });
      };

      const formatDate = (d) => {
        if (!d) return "—";
        try {
          const dt = new Date(d + "T00:00:00");
          return dt.toLocaleDateString("en-IN", {
            weekday: "short",
            day: "2-digit",
            month: "short",
            year: "numeric",
          });
        } catch (e) {
          return d;
        }
      };

      const calculateNights = (inDate, outDate) => {
        if (!inDate || !outDate) return 1;
        const s = new Date(inDate + "T00:00:00");
        const e = new Date(outDate + "T00:00:00");
        const diff = Math.round((e - s) / 86400000);
        return Math.max(1, isNaN(diff) ? 1 : diff);
      };

      const nights = calculateNights(bookingData.check_in, bookingData.check_out);
      const totalAmount = amountParam || bookingData.total_amount || 0;
      const refId = orderId || bookingData.order_id || "CNH-CONFIRMED";

      // ── Render Views ────────────────────────────────────────────────────────
      if (isSuccess) {
        renderSuccessView();
        launchConfetti();
      } else {
        renderFailureView();
      }

      // ── SUCCESS VIEW ────────────────────────────────────────────────────────
      function renderSuccessView() {
        const guestInitials = (bookingData.name || "G").charAt(0).toUpperCase();
        const guestsText = `${bookingData.adults || 1} Adult${(bookingData.adults || 1) > 1 ? "s" : ""}` +
          (bookingData.children > 0 ? `, ${bookingData.children} Child${bookingData.children > 1 ? "ren" : ""}` : "");

        card.innerHTML = `
          <!-- Hero Banner -->
          <div class="hero-success">
            <div class="status-ring success-ring">
              <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </div>
            <h2 class="hero-title">Booking Confirmed! 🎉</h2>
            <p class="hero-subtitle success">
              Your stay at Cloud Nandy Hills has been successfully reserved and confirmed. We look forward to welcoming you to the misty hills!
            </p>
          </div>

          <!-- Body -->
          <div class="card-body">
            <!-- Guest Highlight -->
            ${bookingData.name ? `
              <div class="guest-highlight-card">
                <div class="guest-avatar">${guestInitials}</div>
                <div class="guest-info">
                  <h3>${escapeHtml(bookingData.name)}</h3>
                  <p>
                    ${bookingData.phone ? `<span>📞 ${escapeHtml(bookingData.phone)}</span>` : ""}
                    ${bookingData.email ? `<span>✉️ ${escapeHtml(bookingData.email)}</span>` : ""}
                  </p>
                </div>
              </div>
            ` : ""}

            <!-- Stay Summary -->
            <div class="section-label">
              <span>Reservation Details</span>
              <span class="badge-status confirmed">● CONFIRMED</span>
            </div>

            <div class="details-table">
              <div class="table-row">
                <span class="row-label">Booking Reference</span>
                <span class="row-value">
                  <code>${refId}</code>
                  <button type="button" class="copy-btn" id="btnCopyRef">Copy</button>
                </span>
              </div>
              ${trackingId ? `
                <div class="table-row">
                  <span class="row-label">Payment Transaction ID</span>
                  <span class="row-value"><small>${trackingId}</small></span>
                </div>
              ` : ""}
              <div class="table-row">
                <span class="row-label">Cabin / Room</span>
                <span class="row-value">${escapeHtml(bookingData.room || "Luxury Mountain Cabin")}</span>
              </div>
              <div class="table-row">
                <span class="row-label">Check-In</span>
                <span class="row-value">${formatDate(bookingData.check_in)} &middot; 1:00 PM</span>
              </div>
              <div class="table-row">
                <span class="row-label">Check-Out</span>
                <span class="row-value">${formatDate(bookingData.check_out)} &middot; 11:00 AM</span>
              </div>
              <div class="table-row">
                <span class="row-label">Duration &amp; Guests</span>
                <span class="row-value">${nights} Night${nights > 1 ? "s" : ""} &middot; ${guestsText}</span>
              </div>
              <div class="table-row">
                <span class="row-label">Amount Paid</span>
                <span class="row-value price">${formatCurrency(totalAmount)}</span>
              </div>
              <div class="table-row">
                <span class="row-label">Payment Status</span>
                <span class="row-value" style="color:#10b981;font-weight:700;">Verified &amp; Paid (CCAvenue)</span>
              </div>
            </div>

            <!-- Important Notes -->
            <div class="notice-box">
              <strong>✨ What's Next?</strong><br>
              • Check-in starts at 1:00 PM. Please present a valid government-issued photo ID upon arrival.<br>
              • Complimentary hill breakfast (CP plan) is included with your stay.<br>
              • A confirmation SMS and email have been dispatched to your contact details.
            </div>

            <!-- Action Buttons -->
            <div class="actions-grid">
              <button type="button" class="action-btn btn-primary" id="btnDownloadPdf">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

      // ── PDF GENERATOR (High-Resolution Official Receipt) ───────────────────────
      function generateAndDownloadPdf() {
        if (!window.jspdf || !window.jspdf.jsPDF) {
          alert("PDF generator library is still loading. Please wait 2 seconds and click again.");
          return;
        }

        const doc = new window.jspdf.jsPDF({ unit: "pt", format: "a4" });
        const pageWidth = doc.internal.pageSize.getWidth();
        const pageHeight = doc.internal.pageSize.getHeight();
        const margin = 44;
        const contentWidth = pageWidth - margin * 2;
        let y = margin;

        const safeStr = (v) => String(v || "—");

        // 1. Top Brand Banner
        doc.setFillColor(13, 25, 18); // Deep forest green
        doc.rect(0, 0, pageWidth, 84, "F");

        // Monogram Icon
        doc.setFillColor(180, 95, 60); // Terracotta brand
        doc.circle(margin + 22, 42, 20, "F");
        doc.setFont("helvetica", "bold");
        doc.setFontSize(13);
        doc.setTextColor(255, 255, 255);
        doc.text("CNH", margin + 22, 47, { align: "center" });

        // Resort Name & Address
        doc.setFontSize(20);
        doc.text("Cloud Nandy Hills", margin + 54, 38);
        doc.setFont("helvetica", "normal");
        doc.setFontSize(8.5);
        doc.setTextColor(156, 163, 175);
        doc.text("Poombarai, Kodaikanal · Tamil Nadu 624103", margin + 54, 52);
        doc.text("www.cloudynandyhills.com  ·  090957 44759", margin + 54, 65);

        // Header Right: Reference & Date
        doc.setFont("helvetica", "bold");
        doc.setFontSize(8);
        doc.setTextColor(229, 184, 105); // Gold
        doc.text("OFFICIAL BOOKING CONFIRMATION", pageWidth - margin, 32, { align: "right" });
        doc.setFontSize(11);
        doc.setTextColor(255, 255, 255);
        doc.text(safeStr(refId), pageWidth - margin, 48, { align: "right" });
        if (trackingId) {
          doc.setFont("helvetica", "normal");
          doc.setFontSize(8);
          doc.setTextColor(156, 163, 175);
          doc.text("TXN: " + trackingId, pageWidth - margin, 62, { align: "right" });
        }

        y = 110;

        // 2. Verified Status Badge
        doc.setFillColor(16, 185, 129); // Emerald
        doc.roundedRect(margin, y, 130, 26, 6, 6, "F");
        doc.setFont("helvetica", "bold");
        doc.setFontSize(9.5);
        doc.setTextColor(255, 255, 255);
        doc.text("✓  CONFIRMED & PAID", margin + 65, y + 17, { align: "center" });

        doc.setFont("helvetica", "normal");
        doc.setFontSize(8.5);
        doc.setTextColor(100, 116, 139);
        const issuedDate = new Date().toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" });
        doc.text("Issued: " + issuedDate, pageWidth - margin, y + 17, { align: "right" });

        y += 48;

        // Section Drawer Helper
        function drawSectionHeader(title) {
          doc.setFont("helvetica", "bold");
          doc.setFontSize(9);
          doc.setTextColor(180, 95, 60);
          doc.text(title, margin, y);
          y += 5;
          doc.setDrawColor(180, 95, 60);
          doc.setLineWidth(0.6);
          doc.line(margin, y, margin + contentWidth, y);
          y += 16;
        }

        function drawRow(label, value, isStriped = false) {
          if (isStriped) {
            doc.setFillColor(248, 250, 252);
            doc.rect(margin, y - 11, contentWidth, 22, "F");
          }
          doc.setFont("helvetica", "normal");
          doc.setFontSize(9);
          doc.setTextColor(100, 116, 139);
          doc.text(label, margin + 8, y + 3);

          doc.setFont("helvetica", "bold");
          doc.setTextColor(30, 41, 59);
          doc.text(safeStr(value), margin + contentWidth * 0.44, y + 3);
          y += 22;
        }

        // Section: Guest Information
        drawSectionHeader("1. GUEST DETAILS");
        if (bookingData.name) drawRow("Guest Name", bookingData.name, false);
        if (bookingData.phone) drawRow("Phone Number", bookingData.phone, true);
        if (bookingData.email) drawRow("Email Address", bookingData.email, false);
        y += 12;

        // Section: Stay Details
        drawSectionHeader("2. RESERVATION & CABIN DETAILS");
        drawRow("Cabin / Room", bookingData.room || "Luxury Mountain Cabin", false);
        drawRow("Check-In Date", formatDate(bookingData.check_in) + " at 1:00 PM", true);
        drawRow("Check-Out Date", formatDate(bookingData.check_out) + " at 11:00 AM", false);
        drawRow("Duration of Stay", nights + (nights === 1 ? " Night" : " Nights"), true);
        drawRow("Guests", `${bookingData.adults || 1} Adults` + (bookingData.children > 0 ? `, ${bookingData.children} Children` : ""), false);
        if (bookingData.requests) drawRow("Special Requests", bookingData.requests, true);
        y += 12;

        // Section: Financial Receipt
        drawSectionHeader("3. PAYMENT SUMMARY");
        drawRow("Booking Reference ID", refId, false);
        drawRow("Payment Gateway", "CCAvenue (Secure Online)", true);
        if (trackingId) drawRow("Transaction Reference", trackingId, false);
        drawRow("Total Amount Paid", formatCurrency(totalAmount) + " (Inclusive of all taxes)", true);
        drawRow("Payment Status", "COMPLETED & CONFIRMED", false);
        y += 16;

        // Section: Policies & Rules Box
        doc.setFillColor(248, 250, 248);
        doc.setDrawColor(226, 232, 240);
        doc.setLineWidth(0.6);
        doc.roundedRect(margin, y, contentWidth, 70, 6, 6, "FD");

        doc.setFont("helvetica", "bold");
        doc.setFontSize(8.5);
        doc.setTextColor(15, 23, 42);
        doc.text("Resort Policies & Instructions", margin + 12, y + 16);

        doc.setFont("helvetica", "normal");
        doc.setFontSize(8);
        doc.setTextColor(71, 85, 105);
        doc.text("• Check-in starts at 1:00 PM. Check-out is strictly by 11:00 AM to allow preparation for incoming guests.", margin + 12, y + 32);
        doc.text("• Please present valid government photo identification (Aadhaar / Passport / Driving License) upon arrival.", margin + 12, y + 46);
        doc.text("• Hill breakfast (CP) is served complimentary between 8:00 AM and 10:30 AM at the panoramic dining deck.", margin + 12, y + 60);

        // Footer
        doc.setDrawColor(226, 232, 240);
        doc.setLineWidth(0.5);
        doc.line(margin, pageHeight - 50, pageWidth - margin, pageHeight - 50);

        doc.setFont("helvetica", "normal");
        doc.setFontSize(8);
        doc.setTextColor(148, 163, 184);
        doc.text("Cloud Nandy Hills · Poombarai Village, Kodaikanal, Tamil Nadu 624103 · Helpline: 090957 44759", pageWidth / 2, pageHeight - 34, { align: "center" });
        doc.text("This document is an electronically generated reservation voucher and official payment receipt.", pageWidth / 2, pageHeight - 20, { align: "center" });

        // Save PDF
        const cleanFilename = ("CloudNandy_Booking_" + refId).replace(/[^A-Za-z0-9_\-]/g, "_") + ".pdf";
        doc.save(cleanFilename);
        showToast("✓ Downloaded PDF confirmation voucher!");
      }

      // ── Confetti Celebration Animation ──────────────────────────────────────
      function launchConfetti() {
        const cv = document.getElementById("confettiCanvas");
        if (!cv) return;
        const ctx = cv.getContext("2d");
        cv.width = window.innerWidth;
        cv.height = window.innerHeight;

        const colors = ["#10b981", "#34d399", "#b45f3c", "#e5b869", "#fbbf24", "#ffffff", "#059669"];
        const particles = [];
        const count = 120;

        for (let i = 0; i < count; i++) {
          particles.push({
            x: Math.random() * cv.width,
            y: -20 - Math.random() * 100,
            w: 6 + Math.random() * 8,
            h: 10 + Math.random() * 8,
            rotation: Math.random() * Math.PI * 2,
            rotSpeed: (Math.random() - 0.5) * 0.16,
            vx: (Math.random() - 0.5) * 3,
            vy: 2.5 + Math.random() * 4.5,
            color: colors[Math.floor(Math.random() * colors.length)],
            alpha: 1,
          });
        }

        let animationFrame;
        function render() {
          ctx.clearRect(0, 0, cv.width, cv.height);
          let hasActive = false;

          particles.forEach((p) => {
            p.x += p.vx;
            p.y += p.vy;
            p.rotation += p.rotSpeed;
            if (p.y > cv.height - 40) p.alpha -= 0.035;
            if (p.alpha > 0) hasActive = true;

            ctx.save();
            ctx.globalAlpha = Math.max(0, p.alpha);
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rotation);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
            ctx.restore();
          });

          if (hasActive) {
            animationFrame = requestAnimationFrame(render);
          } else {
            ctx.clearRect(0, 0, cv.width, cv.height);
          }
        }

        render();

        window.addEventListener("resize", () => {
          cv.width = window.innerWidth;
          cv.height = window.innerHeight;
        });
      }

      function escapeHtml(str) {
        return String(str || "").replace(/[&<>"']/g, (m) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;",
        }[m]));
      }
    })();
  </script>
